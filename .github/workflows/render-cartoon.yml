name: Render 2D cartoon voice variants

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Материалы для выпуска"
        type: choice
        default: episode-002
        options:
          - episode-002
          - episode-003-voices
          - episode-003-elevenlabs
          - episode-003-render
      dialogue_run:
        description: "Для экспорта выпуска 003 укажите ID записи диалогов ElevenLabs"
        type: string
        required: false

permissions:
  contents: read

jobs:
  gemini-tts:
    if: inputs.episode == 'episode-002' || !inputs.episode
    name: Gemini TTS version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Gemini voice clips
        env:
          SPROSI_AI_OZVUCHKA: ${{ secrets.SPROSI_AI_OZVUCHKA }}
        run: node scripts/generate-voice-variants.mjs --provider=google src/episodes/episode-002-voice.json
      - run: node scripts/create-sound-effects.mjs
      - run: npx remotion browser ensure
      - name: Render video
        run: npx remotion render src/index.tsx SprosiAcademyStoryPromoGemini out/sprosi-ai-episode-002-gemini.mp4 --codec=h264 --crf=21 --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: sprosi-ai-episode-002-gemini
          path: out/sprosi-ai-episode-002-gemini.mp4
          if-no-files-found: error
          compression-level: 0

  elevenlabs:
    if: inputs.episode == 'episode-002' || !inputs.episode
    name: ElevenLabs version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate ElevenLabs voice clips
        env:
          ELEVEN_LABS9: ${{ secrets.ELEVEN_LABS9 }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: node scripts/generate-voice-variants.mjs --provider=elevenlabs src/episodes/episode-002-voice.json
      - run: node scripts/create-sound-effects.mjs
      - run: npx remotion browser ensure
      - name: Render video
        run: npx remotion render src/index.tsx SprosiAcademyStoryPromoElevenLabs out/sprosi-ai-episode-002-elevenlabs.mp4 --codec=h264 --crf=21 --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: sprosi-ai-episode-002-elevenlabs
          path: out/sprosi-ai-episode-002-elevenlabs.mp4
          if-no-files-found: error
          compression-level: 0

  recording:
    if: inputs.episode == 'episode-003-voices' || inputs.episode == 'episode-003-elevenlabs'
    name: Episode 003 / ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(inputs.episode == 'episode-003-elevenlabs' && '["elevenlabs"]' || '["google","elevenlabs"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record Russian dialogue
        env:
          SPROSI_AI_OZVUCHKA: ${{ matrix.provider == 'google' && secrets.SPROSI_AI_OZVUCHKA || '' }}
          ELEVEN_LABS9: ${{ matrix.provider == 'elevenlabs' && secrets.ELEVEN_LABS9 || '' }}
        run: node scripts/generate-voice-variants.mjs --provider=${{ matrix.provider }} src/episodes/episode-003-voice.json
      - uses: actions/upload-artifact@v4
        if: "!cancelled()"
        with:
          name: dialogue-003-${{ matrix.provider }}
          path: public/audio/episode-003/${{ matrix.provider }}/*.mp3
          if-no-files-found: error
          retention-days: 14

  night-shift-film:
    if: inputs.episode == 'episode-003-render'
    name: Night Shift / ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {provider: elevenlabs, composition: NightShiftElevenLabs}
          - {provider: google-public, composition: NightShiftGoogle}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && python -m pip install numpy scipy
      - if: matrix.provider == 'elevenlabs'
        uses: actions/download-artifact@v4
        with:
          name: dialogue-003-elevenlabs
          run-id: ${{ inputs.dialogue_run }}
          github-token: ${{ github.token }}
          path: public/audio/episode-003/elevenlabs
      - if: matrix.provider == 'google-public'
        run: python scripts/record-google-public-003.py
      - run: python scripts/mix-episode-003.py ${{ matrix.provider }}
      - run: npx remotion browser ensure
      - name: Render the film
        run: npx remotion render src/index.tsx ${{ matrix.composition }} out/tretiy-gaid-${{ matrix.provider }}.mp4 --codec=h264 --crf=18 --audio-bitrate=192k --image-format=jpeg --jpeg-quality=94 --concurrency=2 --gl=swangle
      - uses: actions/upload-artifact@v4
        with:
          name: tretiy-gaid-${{ matrix.provider }}
          path: out/tretiy-gaid-${{ matrix.provider }}.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
